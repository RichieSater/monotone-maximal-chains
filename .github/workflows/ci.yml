name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Tectonic 0.17.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
          checksum=1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606
          install_dir="$RUNNER_TEMP/tectonic-0.17.0"
          mkdir -p "$install_dir"
          gh release download 'tectonic@0.17.0' \
            --repo tectonic-typesetting/tectonic --pattern "$asset" \
            --dir "$install_dir"
          printf '%s  %s\n' "$checksum" "$install_dir/$asset" \
            | sha256sum --check
          tar -xzf "$install_dir/$asset" -C "$install_dir"
          sudo install -m 0755 "$install_dir/tectonic" /usr/local/bin/tectonic
          tectonic --version
      - name: Build manuscript PDF
        run: make paper
      - name: Run full test suite with pinned GAP and Tectonic
        env:
          GAP_BIN: /nonexistent
        run: make test
      - name: Commit rebuilt manuscript PDF
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- paper/main.pdf; then
            echo "paper/main.pdf already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          git commit -m "Rebuild manuscript PDF"
          git push
