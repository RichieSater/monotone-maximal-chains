name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run full test suite with digest-pinned GAP 4.11.1
        env:
          GAP_BIN: /nonexistent
        run: make test
